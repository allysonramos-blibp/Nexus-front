<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0.5" cy="0.15" r="0.4">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="0.8" cy="0.75" r="0.45">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.2" cy="0.45" r="0.4">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyanText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#glowTop)"/>
  <rect width="1080" height="1920" fill="url(#glowBottom)"/>
  <rect width="1080" height="1920" fill="url(#glowPurple)"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="0" y1="240" x2="1080" y2="240"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="0" y1="720" x2="1080" y2="720"/>
    <line x1="0" y1="960" x2="1080" y2="960"/>
    <line x1="0" y1="1200" x2="1080" y2="1200"/>
    <line x1="0" y1="1440" x2="1080" y2="1440"/>
    <line x1="0" y1="1680" x2="1080" y2="1680"/>
    <line x1="270" y1="0" x2="270" y2="1920"/>
    <line x1="540" y1="0" x2="540" y2="1920"/>
    <line x1="810" y1="0" x2="810" y2="1920"/>
  </g>

  <!-- TOP BRANDING BADGE -->
  <g transform="translate(540, 180)">
    <rect x="-190" y="-28" width="380" height="56" rx="28" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="-140" cy="0" r="7" fill="#38bdf8"/>
    <text x="-120" y="8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="3">SISTEMA NEXUS</text>
  </g>

  <!-- MAIN LOGO -->
  <text x="540" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="8">NEXUS</text>
  <text x="540" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#94a3b8" letter-spacing="4">SEU CENTRO DE COMANDO DIÁRIO</text>

  <!-- IMPACT HEADLINE -->
  <g transform="translate(540, 480)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f1f5f9">
      DOMINE SUA ROTINA
    </text>
    <text x="0" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#cyanText)">
      EM UM SÓ LUGAR
    </text>
  </g>

  <!-- PILLARS / MODULES (3 CARDS) -->

  <!-- CARD 1: ESTUDOS & CONCURSOS -->
  <g transform="translate(100, 620)" filter="url(#shadow)">
    <rect width="880" height="210" rx="30" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2.5"/>
    <!-- Icon Circle -->
    <rect x="35" y="35" width="70" height="70" rx="20" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2"/>
    <text x="70" y="80" text-anchor="middle" font-size="34">📚</text>
    <!-- Text Content -->
    <text x="135" y="70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="800" fill="#f8fafc">Estudos &amp; Concursos</text>
    <text x="135" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">Simulados, Repetição Espaçada FSRS e Caderno de Erros</text>
    <!-- Badge -->
    <rect x="730" y="45" width="115" height="42" rx="14" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="787" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">+85% TAXA</text>
    <!-- Progress Bar -->
    <rect x="135" y="145" width="700" height="12" rx="6" fill="#334155"/>
    <rect x="135" y="145" width="595" height="12" rx="6" fill="#38bdf8"/>
    <text x="135" y="185" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748b">128 tópicos dominados • 14 revisões pendentes hoje</text>
  </g>

  <!-- CARD 2: TREINOS & ALTA PERFORMANCE -->
  <g transform="translate(100, 870)" filter="url(#shadow)">
    <rect width="880" height="210" rx="30" fill="url(#cardGrad)" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="2.5"/>
    <!-- Icon Circle -->
    <rect x="35" y="35" width="70" height="70" rx="20" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="2"/>
    <text x="70" y="80" text-anchor="middle" font-size="34">⚡</text>
    <!-- Text Content -->
    <text x="135" y="70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="800" fill="#f8fafc">Treinos &amp; Cargas</text>
    <text x="135" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">Divisão A/B/C/D, progressão de carga e histórico detalhado</text>
    <!-- Badge -->
    <rect x="730" y="45" width="115" height="42" rx="14" fill="#f43f5e" fill-opacity="0.2"/>
    <text x="787" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#fb7185">4/5 NA SEMANA</text>
    <!-- Progress Bar -->
    <rect x="135" y="145" width="700" height="12" rx="6" fill="#334155"/>
    <rect x="135" y="145" width="560" height="12" rx="6" fill="#f43f5e"/>
    <text x="135" y="185" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748b">Último treino: Peito &amp; Tríceps • Carga total: 14.820 kg</text>
  </g>

  <!-- CARD 3: GESTÃO FINANCEIRA -->
  <g transform="translate(100, 1120)" filter="url(#shadow)">
    <rect width="880" height="210" rx="30" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="2.5"/>
    <!-- Icon Circle -->
    <rect x="35" y="35" width="70" height="70" rx="20" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2"/>
    <text x="70" y="80" text-anchor="middle" font-size="34">💰</text>
    <!-- Text Content -->
    <text x="135" y="70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="800" fill="#f8fafc">Controle Financeiro</text>
    <text x="135" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">Entradas, saídas, parcelamentos e saldo em tempo real</text>
    <!-- Badge -->
    <rect x="730" y="45" width="115" height="42" rx="14" fill="#10b981" fill-opacity="0.2"/>
    <text x="787" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#34d399">POSITIVO</text>
    <!-- Progress Bar -->
    <rect x="135" y="145" width="700" height="12" rx="6" fill="#334155"/>
    <rect x="135" y="145" width="490" height="12" rx="6" fill="#10b981"/>
    <text x="135" y="185" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748b">Reserva estratégica • Economia de 35% no mês</text>
  </g>

  <!-- AI TUTOR HIGHLIGHT -->
  <g transform="translate(100, 1370)">
    <rect width="880" height="130" rx="24" fill="#1e1b4b" fill-opacity="0.6" stroke="#818cf8" stroke-opacity="0.5" stroke-width="2"/>
    <text x="50" y="75" font-size="36">✨</text>
    <text x="120" y="60" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="800" fill="#e0e7ff">Inteligência Artificial Integrada</text>
    <text x="120" y="96" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="500" fill="#a5b4fc">Desdobre metas, tire dúvidas de concursos e receba diagnósticos diários</text>
  </g>

  <!-- BOTTOM CALL TO ACTION (STICKER EFFECT) -->
  <g transform="translate(540, 1600)">
    <!-- Glow behind button -->
    <rect x="-380" y="-45" width="760" height="90" rx="45" fill="#38bdf8" fill-opacity="0.3" filter="url(#shadow)"/>
    <rect x="-370" y="-40" width="740" height="80" rx="40" fill="url(#cyanText)"/>
    <text x="0" y="12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="900" fill="#0b0f19" letter-spacing="2">
      ARRASTE PRA CIMA OU ACESSE
    </text>
  </g>

  <!-- LINK / PIX BADGE -->
  <g transform="translate(540, 1720)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="700" fill="#38bdf8">
      🔗 nexus-front-phi.vercel.app
    </text>
    <text x="0" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="500" fill="#94a3b8">
      Planos a partir de R$ 24,90 • Teste hoje mesmo
    </text>
  </g>

  <!-- Instagram Story Safe Area Indicators (subtle arrows) -->
  <g transform="translate(540, 1820)" fill="#64748b" text-anchor="middle">
    <text x="0" y="0" font-size="28">👆</text>
  </g>

</svg>