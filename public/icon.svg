<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0b0f19" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#nexusGrad)" stroke-width="4" opacity="0.35" />
  
  <!-- Símbolo N estilizado e conectado (Nexus) -->
  <g transform="translate(96, 96)" filter="url(#glow)">
    <path d="M40 260 L40 60 L120 60 L200 200 L200 60 L280 60 L280 260 L200 260 L120 120 L120 260 Z" 
          fill="url(#nexusGrad)" />
    <!-- Ponto central de núcleo -->
    <circle cx="160" cy="160" r="16" fill="#38bdf8" />
  </g>
</svg>
